<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('kn:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of 'kn:'+s)h=(h*33^c.charCodeAt(0))>>>0;return'x'+h}}
const uid=()=>Math.random().toString(36).slice(2,9),day=()=>new Date().toLocaleDateString('en-CA');
let DB,U=null,pend=0,ver=0,SNAP={},LAST='1970-01-01T00:00:00Z',S={v:'home'},CART={vid:null,it:[]},TMP={},FM,FS,YES;
const SB='https://ovgwbrcgdxpxptcjvpmh.supabase.co/rest/v1/docs',H={apikey:'sb_publishable_UPjpimH-aBlILKEC8Tc5Bw_SzxamwIS','Content-Type':'application/json'},COLS=['st','vd','mn','od','nt','ad'],idOf=x=>x.id||x.u;
function save(){ver++;const up=[],seen={};COLS.forEach(c=>DB[c].forEach(x=>{const k=c+'/'+idOf(x),s=JSON.stringify(x);seen[k]=1;if(SNAP[k]!==s){SNAP[k]=s;up.push({col:c,id:String(idOf(x)),data:x,del:false})}}));
for(const k of Object.keys(SNAP))if(!seen[k]){delete SNAP[k];const i=k.indexOf('/');up.push({col:k.slice(0,i),id:k.slice(i+1),data:{},del:true})}
if(up.length)push(up)}
async function push(up){pend++;try{const r=await fetch(SB+'?on_conflict=col,id',{method:'POST',headers:{...H,Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(up)});if(!r.ok)throw 0}catch(e){toast('บันทึกไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่')}pend--}
async function pull(){const v=ver,r=await fetch(SB+'?select=col,id,data,del,updated_at&updated_at=gte.'+encodeURIComponent(LAST)+'&order=updated_at.asc&limit=1000',{headers:H});if(!r.ok)throw 0;const rows=await r.json();if(v!=ver||pend)return 0;let ch=0;
for(const w of rows){const a=DB[w.col];if(!a)continue;const k=w.col+'/'+w.id,i=a.findIndex(x=>String(idOf(x))==w.id);LAST=w.updated_at;
if(w.del){if(i>=0){a.splice(i,1);ch=1}delete SNAP[k]}else{const s=JSON.stringify(w.data);if(SNAP[k]!==s){i>=0?a[i]=w.data:a.push(w.data);SNAP[k]=s;ch=1}}}
return rows.length>=1000?1000:ch}
async function sync(first){let ch=0;try{let n;do{n=await pull();if(n)ch=1}while(first&&n>=1000)}catch(e){return}
if(!ch||first)return;if(U&&!me()){U=null;S={v:'home'}}if(!$('#md').innerHTML&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))render();else chk()}
const me=()=>!U?null:U.role=='s'?DB.st.find(x=>x.id==U.id):U.role=='v'?DB.vd.find(x=>x.id==U.id):DB.ad.find(x=>x.u==U.id),nm=()=>{const u=me();return u?u.name||u.u:''};
function toast(m,ok){const d=document.createElement('div');d.className='toast'+(ok?' ok':'');d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),4200)}
function beep(){try{const c=new(window.AudioContext||webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.25,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.7);o.start();o.stop(c.currentTime+.7)}catch(e){}}
function notify(to,m){DB.nt.push({id:uid(),to,m,r:0})}
function chk(){if(!U)return;const k=U.role+':'+U.id,n=DB.nt.filter(x=>x.to==k&&!x.r);if(n.length){n.forEach(x=>{x.r=1;toast(x.m,1)});beep();save()}}
function show(h){$('#md').innerHTML=h?`<div class="mb" data-a="cl"></div><div class="mc">${h}</div>`:''}
function ask(m,f){YES=f;show(`<p>${m}</p><div class="row"><button class="b" data-a="cl">ยกเลิก</button><button class="b bd" data-a="yes">ยืนยัน</button></div>`)}
function form(t,fs,cb){FM=cb;FS=fs;TMP={};show(`<h3>${t}</h3>${fs.map(f=>`<label>${f.l}${f.t=='sel'?`<select id="f_${f.k}">${f.o.map(o=>`<option value="${E(o[0])}" ${o[0]==f.v?'selected':''}>${E(o[1])}</option>`).join('')}</select>`:f.t=='file'?`<input type="file" accept="image/*" data-f="${f.k}"><img id="pv_${f.k}" class="pv" src="${f.v||''}" ${f.v?'':'hidden'}>`:`<input id="f_${f.k}" type="${f.t||'text'}" value="${E(f.v??'')}">`}</label>`).join('')}<div class="row"><button class="b" data-a="cl">ยกเลิก</button><button class="b bp" data-a="fs">บันทึก</button></div>`)}
function ok(m){save();show('');render();m&&toast(m,1)}
function img(f,w,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,w/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.7))};i.src=r.result};r.readAsDataURL(f)}
const SL={new:'รอร้านรับ',cooking:'กำลังปรุง',done:'พร้อมรับ',picked:'รับแล้ว',cancel:'ยกเลิก'},TC={new:'',cooking:'wn',done:'ok',picked:'',cancel:'bad'},tm=t=>new Date(t).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
const NAV={s:[['shops','ร้านค้า','🏪'],['my','คิวของฉัน','🎫'],['his','ประวัติ','🕘'],['acct','โปรไฟล์','👤']],v:[['vq','คิว','🔔'],['vm','เมนู','📋'],['vh','ยอดขาย','💰'],['acct','ตั้งค่า','⚙️']],a:[['ov','ภาพรวม','📊'],['st','นักเรียน','🎓'],['vd','ร้านค้า','🏪'],['mn','เมนู','📋'],['od','ออเดอร์','🧾'],['acct','บัญชี','🔑']]},DEF={s:'shops',v:'vq',a:'ov'};
const ctot=()=>CART.it.reduce((a,i)=>a+i.p*i.q,0),cn=()=>CART.it.reduce((a,i)=>a+i.q,0),cbar=()=>cn()?`<button class="b bp fab" data-a="go" data-v="cart">🛒 ดูตะกร้า · ${cn()} รายการ · ฿${ctot()}</button>`:'';
const banner=()=>me().must?`<div class="warn">⚠️ คุณยังใช้รหัสผ่านเริ่มต้น <a href="#" data-a="go" data-v="acct" data-s="pw">เปลี่ยนรหัสผ่านตอนนี้</a></div>`:'';
const itemsH=o=>o.items.map(i=>`${i.q}× ${E(i.n)}${i.o?` <small>(${E(i.o)})</small>`:''}`).join('<br>');
const trk=o=>{const k={new:0,cooking:1,done:2}[o.st];return`<div class="trk">${['ออเดอร์','กำลังปรุง','เสร็จสิ้น'].map((t,i)=>`<div class="s${i} ${i<=k?'on':''}"><i>${i<k?'✓':i+1}</i>${t}</div>`).join('')}</div>${o.st=='done'?'<div class="warn" style="background:#16a34a22;color:var(--ok)">✅ พร้อมแล้ว! กรุณารับอาหารที่ร้าน'+(o.pay=='cash'?' และชำระเงินสด ฿'+o.total:'')+'</div>':'<small>กรุณารับอาหารที่ร้านเมื่อสถานะเสร็จสิ้น</small>'}`};
function oc(o,r){let b='';if(r=='s'&&o.st=='new')b=`<button class="b bd sm" data-a="cancel" data-v="${o.id}">ยกเลิกออเดอร์</button>`;
if(r=='v'){const B=(l,s,c)=>`<button class="b ${c||'bp'} w" data-a="st" data-v="${o.id}:${s}">${l}</button>`;
if(o.st=='new')b=(o.pay=='qr'&&!o.paid?`<button class="b bp w" data-a="paid" data-v="${o.id}">ยืนยันสลิป</button>`:B('รับออเดอร์ · เริ่มปรุง','cooking'))+`<button class="b sm" style="margin-top:6px" data-a="st" data-v="${o.id}:cancel">ปฏิเสธ</button>`;
if(o.st=='cooking')b=B('เสร็จสิ้น (แจ้งลูกค้า)','done');if(o.st=='done')b=B('ลูกค้ารับแล้ว','picked','')}
return`<div class="c"><div class="row"><span class="q">Q${o.q}</span><span class="tag ${TC[o.st]}">${SL[o.st]}</span></div><p><b>${E(r=='v'?o.sname+' ('+o.sid+')':o.vname)}</b> · ${tm(o.t)}</p>${itemsH(o)}${o.note?`<div class="note">📝 ${E(o.note)}</div>`:''}<div class="row" style="margin-top:8px"><span class="tag">${o.pay=='qr'?'โอน QR · '+(o.paid?'ยืนยันแล้ว':'รอยืนยันสลิป'):'เงินสด'}</span><b>฿${o.total}</b></div>${o.slip&&r=='v'?`<img class="slip" src="${o.slip}">`:''}${r=='s'&&TC[o.st]!=null&&['new','cooking','done'].includes(o.st)?trk(o):''}<div style="margin-top:8px">${b}</div></div>`}
function tbl(h,rows){return`<input placeholder="ค้นหา..." oninput="filt(this.value,'#tb tr')"><div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody id="tb">${rows.map(r=>`<tr data-t="${E(r[0])}">${r[1].map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
const filt=(q,sel)=>document.querySelectorAll(sel||'#lst>[data-t]').forEach(e=>e.hidden=!e.dataset.t.includes(q));
const bt=(l,v,c)=>`<button class="b sm ${c||''}" data-a="x" data-v="${v}">${l}</button>`;
const V={s:{shops(){const cs=['ทั้งหมด',...new Set(DB.vd.map(v=>v.cat))];return`<h2>สวัสดี, ${E(nm())}</h2>${banner()}<input placeholder="🔍 ค้นหาร้านหรือเมนู" oninput="filt(this.value)"><div class="chips">${cs.map(c=>`<button class="chip ${(S.cat||'ทั้งหมด')==c?'on':''}" data-a="cat" data-v="${E(c)}">${E(c)}</button>`).join('')}</div><div class="g" id="lst">${DB.vd.filter(v=>!S.cat||S.cat=='ทั้งหมด'||v.cat==S.cat).map(v=>`<div class="c shop" data-a="shop" data-v="${v.id}" data-t="${E(v.name+' '+DB.mn.filter(m=>m.v==v.id).map(m=>m.n).join(' '))}"><div class="cov">${v.em}</div><b>${E(v.name)}</b><div><span class="tag">${E(v.cat)}</span> <span class="tag ${v.open?'ok':'bad'}">${v.open?'เปิดอยู่':'ปิดอยู่'}</span></div></div>`).join('')}</div>${cbar()}`},
